<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NeuroLink — Where Memories Live Forever</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       1. PAGE / RESET & CONTAINER
       ========================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #0d1017;
      color: #f2efe7;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    a {
      color: #e8ddc4;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a:hover {
      color: #f5edd8;
    }

    .hero-container {
      width: 100%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #0d1017 0%, #141826 45%, #1c2233 100%);
    }

    /* ==========================================================
       2. BACKGROUND VIDEO
       ========================================================== */
    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }

    /* ==========================================================
       3. OVERLAYS (Bottom only, top stays crystal clear)
       ========================================================== */
    /* Overlay 1: Bottom fade */
    .overlay-bottom-fade {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: linear-gradient(180deg, transparent 0%, transparent 42%, oklch(0.05 0.02 265 / 0.97) 100%);
    }

    /* Overlay 2: Soft edge vignette */
    .overlay-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(ellipse 90% 70% at 50% 45%, transparent 45%, oklch(0.06 0.02 265 / 0.55) 100%);
    }

    /* Bottom subtle glow */
    .bottom-glow {
      position: absolute;
      bottom: -320px;
      left: 50%;
      transform: translateX(-50%);
      width: 1600px;
      height: 600px;
      background: radial-gradient(ellipse at center, oklch(0.55 0.05 265 / 0.35) 0%, transparent 65%);
      pointer-events: none;
      z-index: 1;
    }

    /* ==========================================================
       4. FLOATING STAR DOTS (Cream #e8ddc4)
       ========================================================== */
    .star-dot {
      position: absolute;
      border-radius: 50%;
      background: #e8ddc4;
      pointer-events: none;
      z-index: 1;
    }

    .star-dot-1 {
      top: 14%;
      left: 14%;
      width: 3px;
      height: 3px;
      opacity: 0.5;
      box-shadow: 0 0 6px 1px oklch(0.85 0.08 85 / 0.5);
    }

    .star-dot-2 {
      top: 28%;
      right: 18%;
      width: 2px;
      height: 2px;
      opacity: 0.4;
      box-shadow: 0 0 5px 1px oklch(0.85 0.08 85 / 0.4);
    }

    .star-dot-3 {
      top: 49%;
      left: 10%;
      width: 2px;
      height: 2px;
      opacity: 0.35;
    }

    .star-dot-4 {
      top: 60%;
      right: 12%;
      width: 3px;
      height: 3px;
      opacity: 0.3;
      box-shadow: 0 0 6px 1px oklch(0.85 0.08 85 / 0.35);
    }

    .star-dot-5 {
      top: 21%;
      left: 33%;
      width: 2px;
      height: 2px;
      opacity: 0.3;
    }

    .star-dot-6 {
      top: 40%;
      right: 33%;
      width: 2px;
      height: 2px;
      opacity: 0.45;
    }

    /* ==========================================================
       5. NAVBAR
       ========================================================== */
    .navbar {
      position: relative;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: clamp(16px, 3vw, 32px) clamp(20px, 5.5vw, 80px);
    }

    .nav-logo {
      display: inline-flex;
      align-items: center;
      color: #f5f2ea;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .nav-logo:hover {
      opacity: 0.9;
    }

    .nav-logo svg {
      width: 129px;
      height: 36px;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: clamp(16px, 2.8vw, 40px);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .nav-link-item {
      color: #ffffff;
      transition: opacity 0.2s ease;
    }

    .nav-link-item:hover {
      color: #ffffff;
      opacity: 0.8;
    }

    .btn-signin {
      padding: 10px 26px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #ffffff;
      font-size: 13px;
      font-weight: 400;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .btn-signin:hover {
      background: rgba(255, 255, 255, 0.24);
      border-color: rgba(255, 255, 255, 0.4);
      color: #ffffff;
    }

    /* ==========================================================
       6. HERO CONTENT (Pushed to bottom)
       ========================================================== */
    .hero-content {
      position: relative;
      z-index: 2;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: clamp(140px, 22vh, 220px) clamp(20px, 8vw, 120px) clamp(56px, 9vh, 90px);
    }

    /* 6a. Star ornament */
    .star-ornament {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: clamp(20px, 3vh, 32px);
    }

    .ornament-line-left {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #FFB733);
    }

    .star-glyph {
      color: #FFB733;
      font-size: 18px;
      line-height: 1;
      user-select: none;
    }

    .ornament-line-right {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, #FFB733, transparent);
    }

    /* 6b. Main headline (H1) */
    .hero-headline {
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      font-size: 44px;
      line-height: 1.12;
      letter-spacing: -0.02em;
      color: #f7f4ec;
      margin: 0 0 20px 0;
      white-space: nowrap;
    }

    .hero-headline span {
      color: #ffffff;
    }

    /* 6c. Secondary text */
    .hero-description {
      font-size: 15px;
      font-weight: 400;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.75);
      margin: 0 0 36px 0;
      text-align: center;
      max-width: 640px;
    }

    /* 6d. Primary button */
    .btn-create-memorial {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 34px;
      border-radius: 999px;
      background: #ffffff;
      color: #000000;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.01em;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: none;
      transition: transform 0.18s ease;
    }

    .btn-create-memorial:hover {
      color: #000000;
      transform: translateY(-1px);
    }

    .btn-arrow-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Responsive adjustments for mobile screens */
    @media (max-width: 768px) {
      .hero-headline {
        font-size: clamp(28px, 7.5vw, 40px);
        white-space: normal;
      }
      .nav-links {
        gap: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- FULL-VIEWPORT HERO CONTAINER -->
  <section class="hero-container">

    <!-- 2. BACKGROUND VIDEO (Autoplays, muted, loops forever, no controls) -->
    <video
      class="hero-video"
      autoplay
      muted
      loop
      playsinline
      preload="none"
    ></video>

    <!-- 3. OVERLAYS (Bottom only) -->
    <div class="overlay-bottom-fade"></div>
    <div class="overlay-vignette"></div>
    <div class="bottom-glow"></div>

    <!-- 4. FLOATING STAR DOTS -->
    <div class="star-dot star-dot-1"></div>
    <div class="star-dot star-dot-2"></div>
    <div class="star-dot star-dot-3"></div>
    <div class="star-dot star-dot-4"></div>
    <div class="star-dot star-dot-5"></div>
    <div class="star-dot star-dot-6"></div>

    <!-- 5. NAVBAR -->
    <nav class="navbar" aria-label="Main Navigation">
      <!-- Left: Logo -->
      <a href="#" class="nav-logo" aria-label="NeuroLink Home">

      </a>

      <!-- Right: Navigation Links & Sign In Pill -->
      <div class="nav-links">
        <a href="#how-it-works" class="nav-link-item">How It Works</a>
        <a href="#tributes" class="nav-link-item">Tributes</a>
        <a href="#pricing" class="nav-link-item">Pricing</a>
        <a href="#support" class="nav-link-item">Support</a>
        <a href="#signin" class="btn-signin">Sign In</a>
      </div>
    </nav>

    <!-- 6. HERO CONTENT (Pushed to bottom) -->
    <div class="hero-content">

      <!-- 6a. Star Ornament -->
      <div class="star-ornament" aria-hidden="true">
        <div class="ornament-line-left"></div>
        <span class="star-glyph">✦</span>
        <div class="ornament-line-right"></div>
      </div>

      <!-- 6b. Main Headline (H1) -->
      <h1 class="hero-headline">
        Where Memories <span>Live Forever</span>
      </h1>

      <!-- 6c. Secondary Text (exact 2 lines with <br>) -->
      <p class="hero-description">
        Create a beautiful memorial to share their story, photos, cherished<br>
        moments, and celebrate their life together.
      </p>

      <!-- 6d. Primary Button -->
      <a href="#create" class="btn-create-memorial">
        <span>Create Memorial</span>
        <svg class="btn-arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12h15"></path>
          <path d="M13.5 5.5 20 12l-6.5 6.5"></path>
        </svg>
      </a>

    </div>

  </section>

  <!-- JAVASCRIPT: Unbreakable Video Autoplay Guarantee -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const v = document.querySelector('video');
      if (v) {
        v.muted = true;
        v.src = 'https://cdn.sceneai.art/Hero%20section%20video%20file%20(2)/1aafa16f-30a9-48c5-8964-78cffbad914e.mp4';
        v.play().catch(() => {});
        v.addEventListener('pause', () => v.play().catch(() => {}));
      }
    });
  </script>
